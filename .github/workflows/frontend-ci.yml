# ============================================================================
# LWG 灵务阁 · 前端 CI
#
# 触发：推送到 master、对 master 的 PR、以及手动触发。
#
#   build —— 安装依赖并执行 vite build，确认代码可构建（PR 阶段的主要门禁）。
#   image —— 仅在 push 时构建并推送 nginx 镜像到 ghcr.io。
#            镜像内含构建好的静态资源与 /api 反向代理配置，
#            后端地址由运行时环境变量 LWG_BACKEND_HOST 提供（见 nginx/default.conf.template）。
#
# 镜像地址：ghcr.io/<owner>/lwg-frontend
# 鉴权使用内置 GITHUB_TOKEN，无需额外配置 Secrets。
# ============================================================================
name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lwg-frontend

jobs:
  # ---------------- 构建静态资源 ----------------
  build:
    name: 构建（vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------- 构建并推送镜像 ----------------
  image:
    name: 构建镜像并推送
    needs: build
    # 推送到 main 或手动触发时都构建镜像：
    # PR 不构建（避免给未合并的代码发布镜像），手动触发则便于重发镜像或演练回滚
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与注解
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 输出镜像信息
        run: |
          echo "已推送镜像："
          echo "${{ steps.meta.outputs.tags }}"
